[tool.uv.workspace]
members = [
    "services/shared",
    "services/market_collector",
    "services/kap_collector",
    "services/news_collector",
    "services/technical_analysis",
    "services/report_generator",
    "services/notification_dispatch",
    "services/tefas_collector",
    "services/macro_collector",
    "services/fundamental_analysis",
    "services/macro_analysis",
    "services/news_analysis",
    "services/sentiment_analysis",
    "services/sector_analysis",
    "services/decision_engine",
    "services/risk_engine",
    "services/portfolio_engine",
    "services/compliance_agent",
    "services/backtest_agent",
    "services/memory_agent",
    "apps/api-gateway",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.0",
]
