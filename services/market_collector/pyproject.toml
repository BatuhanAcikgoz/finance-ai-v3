[project]
name = "finance-ai-v3-market-collector"
version = "0.1.0"
description = "BIST market data ingestion service"
requires-python = ">=3.12"
dependencies = [
    "finance-ai-v3-shared",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "faker>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
finance-ai-v3-shared = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501", "BLE001", "F841", "DTZ005", "SIM102", "PLR2004", "PLW0603"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src/**"]
