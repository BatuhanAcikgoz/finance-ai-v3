[project]
name = "finance-ai-v3-tefas-collector"
version = "0.1.0"
description = "TEFAS fund collector for Finance AI V3"
requires-python = ">=3.11"
dependencies = [
    "finance-ai-v3-shared",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "BLE001", "F841", "DTZ005", "SIM102", "PLR2004", "PLW0603"]

[tool.mypy]
python_version = "3.11"
strict = true

ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
finance-ai-v3-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src/**"]
