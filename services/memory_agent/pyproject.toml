[project]
name = "memory-agent"
version = "0.1.0"
description = "Memory Agent - Embeddings and similarity search via Qdrant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "httpx>=0.26.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "BLE001", "F841", "DTZ005", "SIM102", "PLR2004", "PLW0603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src/**"]
