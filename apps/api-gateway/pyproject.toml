[project]
name = "finance-ai-v3-api-gateway"
version = "0.1.0"
description = "FastAPI API Gateway for Finance AI V3"
requires-python = ">=3.12"
dependencies = [
    "finance-ai-v3-shared",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
finance-ai-v3-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src/**"]
