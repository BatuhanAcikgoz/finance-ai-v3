<!DOCTYPE html>
<html lang="tr">
<head>
  
  <script>
  // Pre-paint theme bootstrap — runs before any CSS paints.
  (function () {
    try {
      var t = localStorage.getItem('finance-ai.theme');
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Finance AI V3 — Alerts inbox: severity, status, filters." />
  <title>Uyarılar / Alerts — Finance AI V3</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=2026.10.11" />
</head>
<body data-active-nav="alerts" data-require-session>

  <main class="container" id="main">
    <header class="app-header">
      <div class="brand">
        <a class="back-link" href="index.html">← Ana sayfa / Home</a>
        <h1>Uyarılar / Alerts</h1>
        <p class="subtitle">Sistem uyarıları &amp; bildirimler / System alerts &amp; notifications</p>
      </div>
    </header>

    <section class="card glass">
      <!-- Filter chips: severity + status -->
      <div class="filters" role="group" aria-label="Filters">
        <span class="chip-label">Ciddiyet / Severity:</span>
        <div class="filter-group" id="sev-chips">
          <button class="chip is-active" data-sev="all"      type="button">Hepsi / All</button>
          <button class="chip"           data-sev="critical" type="button">Kritik / Critical</button>
          <button class="chip"           data-sev="warn"     type="button">Uyarı / Warn</button>
          <button class="chip"           data-sev="info"     type="button">Bilgi / Info</button>
        </div>
        <span class="chip-label">Durum / Status:</span>
        <div class="filter-group" id="status-chips">
          <button class="chip is-active" data-status="all"    type="button">Hepsi / All</button>
          <button class="chip"           data-status="unread" type="button">Okunmamış / Unread</button>
          <button class="chip"           data-status="read"   type="button">Okunmuş / Read</button>
        </div>
      </div>

      <!-- Alerts list -->
      <ul class="alerts" id="alerts-list" aria-live="polite">
        <li class="empty-state">Yükleniyor / Loading…</li>
      </ul>
    </section>

    <span id="refresh-indicator" hidden></span>
    <footer class="app-footer">
      <span id="meta">—</span>
      <span>API: /api/v1/alerts</span>
    </footer>
  </main>

  
  <script src="side-nav.js?v=2026.10.11" defer></script>
  <script src="ui.js?v=2026.10.11" defer></script>
  <script src="alerts.js?v=2026.10.11" defer></script>

  <!-- JS aux ids shim -->
  <span id="refresh-text" hidden></span>
  </body>
</html>
