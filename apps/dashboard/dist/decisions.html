<!DOCTYPE html>
<html lang="tr">
<head>
  
  <script>
  // Pre-paint theme bootstrap — runs before any CSS paints.
  (function () {
    try {
      var t = localStorage.getItem('finance-ai.theme');
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kararlar / Decisions — Finance AI V3 karar listesi." />
  <title>Kararlar / Decisions — Finance AI V3</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=2026.10.11" />
</head>
<body data-active-nav="decisions" data-require-session>

  <main class="container" id="main">
    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="brand">
        <a class="back-link" href="index.html">← Ana sayfa / Overview</a>
        <h1>Kararlar / Decisions</h1>
        <p class="subtitle">Son alınan kararlar — tarih, sembol, aksiyon ve güven filtresi</p>
      </div>
    </header>

    <!-- ===== Filters ===== -->
    <section class="card glass" aria-labelledby="filters-heading">
      <h2 id="filters-heading">Filtreler / Filters</h2>
      <div class="filters" id="filters-form">
        <div class="field">
          <label for="f-from">Başlangıç / From</label>
          <input type="date" id="f-from" />
        </div>
        <div class="field">
          <label for="f-to">Bitiş / To</label>
          <input type="date" id="f-to" />
        </div>
        <div class="field">
          <label for="f-ticker">Sembol / Ticker</label>
          <input type="text" id="f-ticker" list="ticker-list" placeholder="örn. THYAO" autocomplete="off" />
          <datalist id="ticker-list"></datalist>
        </div>
        <div class="field">
          <label for="f-action">Aksiyon / Action</label>
          <select id="f-action">
            <option value="">tümü / all</option>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
            <option value="HOLD">HOLD</option>
            <option value="REDUCE">REDUCE</option>
            <option value="INSUFFICIENT_EVIDENCE">INSUFFICIENT_EVIDENCE</option>
          </select>
        </div>
        <div class="field" data-disabled="true" title="Yakında / Coming soon">
          <label for="f-confidence">Güven / Confidence</label>
          <input type="range" id="f-confidence" min="0" max="100" value="0" />
          <span class="range-readout" id="f-confidence-readout">≥ 0%</span>
        </div>
        <div class="field">
          <label for="f-compliance">Uyum / Compliance</label>
          <select id="f-compliance">
            <option value="">tümü / any</option>
            <option value="APPROVED">APPROVED</option>
            <option value="PENDING">PENDING</option>
            <option value="BLOCKED">BLOCKED</option>
          </select>
        </div>
        <div class="field actions">
          <button type="button" class="btn" id="f-clear">Temizle / Clear</button>
          <button type="button" class="btn btn-primary" id="f-refresh">Yenile / Refresh</button>
        </div>
      </div>
    </section>

    <!-- ===== Results ===== -->
    <section class="card glass" aria-labelledby="results-heading">
      <h2 id="results-heading">Sonuçlar / Results <span id="results-count" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--label-secondary)"></span></h2>
      <div id="results-error"></div>
      <div id="results-host"></div>
    </section>

    <!-- ===== Footer ===== -->
    <span id="refresh-indicator" hidden></span>
    <footer class="app-footer">
      <span id="last-updated"></span>
      <span><a href="index.html">Ana sayfa / Overview</a></span>
    </footer>
  </main>

  
  <script src="side-nav.js?v=2026.10.11" defer></script>
  <script src="ui.js?v=2026.10.11" defer></script>
  <script src="decisions.js?v=2026.10.11" defer></script>

  <!-- JS aux ids shim -->
  <span id="empty-retry" hidden></span>
  </body>
</html>
