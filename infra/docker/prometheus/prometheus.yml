# Minimal Prometheus config for the finance-ai-v3 dev stack.
# Scrapes itself + the otel-collector. Add api-gateway / workers when they
# expose /metrics. See https://prometheus.io/docs/prometheus/latest/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
