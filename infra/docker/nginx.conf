# Reverse proxy for the static dashboard.
# - /         → static HTML/JS dashboard
# - /api/*    → api-gateway:8000 (strip /api prefix)
# - /health   → api-gateway:8000/health
# - /metrics  → api-gateway:8000/metrics (if exposed later)

upstream api_gateway {
    server api-gateway:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy
    # Strip /api prefix before forwarding to the upstream so the backend
    # sees /v1/... matching its route definitions; proxy_redirect off
    # suppresses FastAPI's 307 Location-header rewriting which would
    # otherwise drop the /api prefix on the second hop.
    location /api/ {
        # CORS — echo the request Origin when it's on the local allowlist,
        # so the dashboard can call the API with credentials even when
        # served from a bare hostname like http://127.0.0.1 (no port).
        # The backend FastAPI CORSMiddleware already covers the common
        # cases; this is the belt-and-braces nginx-level mirror so
        # browser dev-tools 'CORS header missing' warnings stop popping
        # up regardless of which port the user is on.
        set $cors_origin "";
        if ($http_origin ~ "^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"        always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, X-Admin-Token, Authorization, X-Requested-With" always;
        add_header Access-Control-Expose-Headers    "X-Admin-Token-Required, X-Request-ID" always;
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, X-Admin-Token, Authorization" always;
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }
        proxy_pass http://api_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;   # long-lived WS connections
        proxy_send_timeout 86400s;
        proxy_redirect default;     # let nginx rewrite Location properly
        proxy_redirect ~^http://[^/]+(/v1/.*)$ /api$1;
        proxy_redirect ~^http://[^/]+(/health.*)$ /api$1;
    }

    # Convenience aliases for direct health/docs
    location = /health {
        proxy_pass http://api_gateway/health;
    }

    location = /docs {
        proxy_pass http://api_gateway/docs;
    }

    location = /openapi.json {
        proxy_pass http://api_gateway/openapi.json;
    }

    # Static files (HTML/JS/CSS/SVG)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Long cache for hashed assets if you add any later
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
