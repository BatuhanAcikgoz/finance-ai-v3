# =============================================================================
# Finance AI V3 - Docker Compose (Development)
# =============================================================================
# PostgreSQL 16 + Redis 7 + Qdrant 1.10 + LiteLLM + n8n
# =============================================================================

services:
  # === Database ===
  postgres:
    image: postgres:16-alpine
    container_name: finance-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_ai_v3}
      POSTGRES_USER: ${POSTGRES_USER:-finance_ai_v3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-20}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_ai_v3} -d ${POSTGRES_DB:-finance_ai_v3}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-ai-network

  # === Cache + Message Bus ===
  redis:
    image: redis:7-alpine
    container_name: finance-ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-ai-network

  # === Vector Store ===
  # Disabled by default profile to avoid a port conflict with an already-running
  # qdrant on the host. Enable with `COMPOSE_PROFILES=full`.
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: finance-ai-qdrant
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__CLUSTER__ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-ai-network

  # === LLM Gateway ===
  litellm:
    profiles: ["full"]
    image: ghcr.io/berriai/litellm:main
    container_name: finance-ai-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance_ai_v3}:${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}@postgres:5432/${POSTGRES_DB:-finance_ai_v3}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-CHANGE_ME_IN_PRODUCTION}
      STORE_MODEL_IN_DB: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-ai-network

  # === Workflow Orchestration ===
  n8n:
    profiles: ["full"]
    image: n8nio/n8n:latest
    container_name: finance-ai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
      # Database
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-finance_ai_v3}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-finance_ai_v3}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      # Redis for queue
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finance-ai-network

  # === Observability ===
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:latest
    container_name: finance-ai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - finance-ai-network

  grafana:
    profiles: ["full"]
    image: grafana/grafana:latest
    container_name: finance-ai-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - finance-ai-network

  loki:
    profiles: ["full"]
    image: grafana/loki:latest
    container_name: finance-ai-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - finance-ai-network

  jaeger:
    profiles: ["full"]
    image: jaegertracing/all-in-one:latest
    container_name: finance-ai-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - finance-ai-network

  otel-collector:
    profiles: ["full"]
    image: otel/opentelemetry-collector:latest
    container_name: finance-ai-otel
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus exporter metrics
    volumes:
      - ./otel/otel.yml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - finance-ai-network

  # =============================================================================
  # Application services (takeover)
  # =============================================================================

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    image: finance-ai-v3/api-gateway:dev
    container_name: finance-ai-api-gateway
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finance_ai_v3}
      POSTGRES_USER: ${POSTGRES_USER:-finance_ai_v3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_pw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_only_pw}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LITELLM_HOST: litellm
      LITELLM_PORT: 4000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - finance-ai-network

  kap-collector:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        SERVICE_DIR: services/kap_collector
        SERVICE_PACKAGE: kap_collector
    image: finance-ai-v3/kap-collector:dev
    container_name: finance-ai-kap-collector
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finance-ai-network

  technical-analysis:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        SERVICE_DIR: services/technical_analysis
        SERVICE_PACKAGE: technical_analysis
    image: finance-ai-v3/technical-analysis:dev
    container_name: finance-ai-technical-analysis
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - finance-ai-network

  decision-engine:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        SERVICE_DIR: services/decision_engine
        SERVICE_PACKAGE: decision_engine
    image: finance-ai-v3/decision-engine:dev
    container_name: finance-ai-decision-engine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      API_GATEWAY_URL: http://api-gateway:8000
      SYNC_TO_API: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started
      technical-analysis:
        condition: service_started
      kap-collector:
        condition: service_started
    networks:
      - finance-ai-network

  report-generator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        SERVICE_DIR: services/report_generator
        SERVICE_PACKAGE: report_generator
    image: finance-ai-v3/report-generator:dev
    container_name: finance-ai-report-generator
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      REPORTS_DIR: /reports
    volumes:
      - reports_data:/reports
    depends_on:
      postgres:
        condition: service_healthy
      decision-engine:
        condition: service_started
    networks:
      - finance-ai-network

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nginx
    image: finance-ai-v3/dashboard:dev
    container_name: finance-ai-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - finance-ai-network

  seed:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    image: finance-ai-v3/seed:dev
    container_name: finance-ai-seed
    restart: "no"
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finance_ai_v3}
      POSTGRES_USER: ${POSTGRES_USER:-finance_ai_v3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_pw}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scripts.seed_dev_data"]
    networks:
      - finance-ai-network


# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  n8n_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  reports_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  finance-ai-network:
    driver: bridge
    name: finance-ai-network